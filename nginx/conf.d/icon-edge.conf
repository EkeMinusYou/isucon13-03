js_import icon from /etc/nginx/njs/icon.js;
js_shared_dict_zone zone=icon_hashes:8m;
js_shared_dict_zone zone=icon_control:64k;
js_var $icon_session_id;

map $upstream_http_x_measurement_session_id $measurement_session_id {
    "" $icon_session_id;
    default $upstream_http_x_measurement_session_id;
}

server {
    listen 127.0.0.1:8055;
    client_max_body_size 4m;
    client_body_buffer_size 4m;
    access_log off;
    location = /status { js_content icon.status; }
    location = /publish { js_content icon.publish; }
    location / { return 404; }
}
