# DNS runs on its own host; the application and DNS share one remote MySQL.
include: [../deployctl/deployments.yaml]

deployments:
  topology-config:
    uploads:
      - &topology_env {label: topology environment, role: all, local: tools/contest/generated/topology.env, remote: /home/isucon/topology.env}
      - &pdns_config {label: host-specific PowerDNS configuration, role: all, local: 'etc/hosts/{host}/powerdns/', remote: /etc/powerdns/, delete: true, validate: 'sudo pdns_server --config=check'}
      - &pdns_unit {label: PowerDNS systemd drop-in, role: all, local: etc/systemd/system/pdns.service.d/, remote: /etc/systemd/system/pdns.service.d/}
      - &zone_boot {label: DNS boot initialization, role: all, local: etc/vendor-scripts/init_zone_once.sh, remote: /usr/local/bin/isupipe-init-zone-once.sh, validate: 'bash -n /usr/local/bin/isupipe-init-zone-once.sh'}
    activations:
      - label: reload topology units
        role: all
        script: |
          set -eu
          sudo chmod 0755 /usr/local/bin/isupipe-init-zone-once.sh
          sudo systemctl daemon-reload

  app:
    uploads:
      - &app_code {label: application, role: app, local: '{var:app_dir}/', remote: '{var:remote_home}/{var:app_dir}/', delete: true, excludes: ['*.pprof', default.pgo]}
      - &app_unit {label: systemd unit, role: app, local: 'etc/systemd/system/{var:service}.service', remote: '/etc/systemd/system/{var:service}.service'}
      - &app_sql {label: application initialization SQL, role: app, local: '{var:sql_dir}/', remote: '{var:remote_home}/{var:sql_dir}/', delete: true}
      - &app_zone {label: application DNS initialization assets, role: app, local: webapp/pdns/, remote: '{var:remote_home}/webapp/pdns/', delete: true}
      - {label: application topology environment, role: app, local: tools/contest/generated/topology.env, remote: /home/isucon/topology.env}
      - {label: application DNS client configuration, role: app, local: 'etc/hosts/{host}/powerdns/', remote: /etc/powerdns/, delete: true, validate: 'sudo pdns_server --config=check'}
    activations: &app_activation
      - label: restart application
        role: app
        script: |
          set -eu
          sudo chown -R {var:isucon_user}:{var:isucon_user} {var:remote_home}/{var:app_dir} {var:remote_home}/webapp/sql {var:remote_home}/webapp/pdns
          sudo install -d -o {var:isucon_user} -g {var:isucon_user} -m 0755 /var/lib/isupipe /var/lib/isupipe/icons
          sudo systemctl daemon-reload
          sudo systemctl restart {var:service}
          sudo systemctl is-active --quiet {var:service}

  app-after-schema:
    uploads: [*app_code, *app_unit, *app_sql, *app_zone]
    activations: *app_activation

  app-stop:
    activations:
      - label: stop all application writers before reset
        role: all
        script: |
          set -eu
          sudo systemctl stop {var:service}
          test "$(sudo systemctl show {var:service} -p MainPID --value)" = 0
          test "$(sudo systemctl show {var:service} -p ActiveState --value)" = inactive

  pdns-config:
    uploads: [*topology_env, *pdns_config, *pdns_unit, *zone_boot]

  pdns:
    uploads: [*topology_env, *pdns_config, *pdns_unit, *zone_boot]
    activations: &dns_restart
      - label: restart DNS server
        role: dns
        script: |
          set -eu
          sudo systemctl daemon-reload
          sudo systemctl restart pdns
          sudo systemctl is-active --quiet pdns

  dns-restart:
    activations: *dns_restart

  db-access:
    uploads:
      - {label: remote database users, role: app_db, local: tools/contest/generated/remote-users.sql, remote: /home/isucon/remote-users.sql}
    activations:
      - label: grant database access to the DNS and application hosts
        role: app_db
        script: |
          set -eu
          sudo mysql < /home/isucon/remote-users.sql

  dns-stop:
    activations:
      - label: stop all DNS database writers
        role: all
        script: |
          set -eu
          sudo systemctl stop pdns
          test "$(sudo systemctl show pdns -p MainPID --value)" = 0
          test "$(sudo systemctl show pdns -p ActiveState --value)" = inactive

  db-schema:
    uploads:
      - {label: SQL and DNS schema assets, role: app_db, local: '{var:sql_dir}/', remote: '{var:remote_home}/{var:sql_dir}/', delete: true}
    activations:
      - label: recreate both shared competition databases
        role: app_db
        script: |
          set -eu
          sudo chown -R {var:isucon_user}:{var:isucon_user} {var:remote_home}/webapp/sql
          sudo mysql -e 'DROP DATABASE IF EXISTS isupipe; CREATE DATABASE isupipe; DROP DATABASE IF EXISTS isudns; CREATE DATABASE isudns;'
          sudo mysql isupipe < {var:remote_home}/{var:sql_dir}/{var:sql_schema_file}
          sudo mysql isudns < {var:remote_home}/webapp/sql/schema/pdns.sql

  dns-start:
    activations:
      - label: start DNS after schema recreation
        role: dns
        script: |
          set -eu
          sudo systemctl start pdns
          sudo systemctl is-active --quiet pdns

  app-initialize:
    activations:
      - label: initialize shared application and DNS data once
        role: app_init
        script: |
          set -eu
          curl --fail-with-body --silent --show-error --max-time 42 -X POST 'http://127.0.0.1:{var:listen_port}{var:initialize_path}'

  dns-roles:
    activations:
      - label: apply DNS server roles
        role: all
        script: |
          set -eu
          case ',{var:dns_hosts},' in
            *',{host},'*) sudo systemctl enable --now pdns; sudo systemctl is-active --quiet pdns ;;
            *) sudo systemctl disable --now pdns ;;
          esac

plans:
  deploy-all:
    deployments:
      topology-config: {}
      mysql: {needs: [topology-config]}
      db-access: {needs: [mysql]}
      dns-restart: {needs: [db-access]}
      app-after-schema: {needs: [dns-restart]}
      nginx: {needs: [app-after-schema]}
  db-recreate:
    deployments:
      topology-config: {}
      app-stop: {needs: [topology-config]}
      dns-stop: {needs: [app-stop]}
      roles-off: {needs: [dns-stop]}
      mysql: {needs: [roles-off]}
      db-access: {needs: [mysql]}
      db-schema: {needs: [db-access]}
      dns-start: {needs: [db-schema]}
      app-after-schema: {needs: [dns-start]}
      app-initialize: {needs: [app-after-schema]}
  roles:
    deployments:
      roles-off: {}
      roles-on: {needs: [roles-off]}
      dns-roles: {needs: [roles-on]}
