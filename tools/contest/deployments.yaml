# DNS keeps its complete zone in memory; MySQL stores application state.
include: [../deployctl/deployments.yaml]

deployments:
  icon-read:
    uploads:
      - {label: icon reader binary, role: icon_read, local: '{var:app_dir}/isupipe', remote: /usr/local/bin/isupipe-icon-read}
      - {label: icon reader unit, role: icon_read, local: etc/systemd/system/isupipe-icons.service, remote: /etc/systemd/system/isupipe-icons.service}
      - {label: icon reader topology, role: icon_read, local: tools/contest/generated/topology.env, remote: /home/isucon/topology.env}
    activations:
      - label: enable and restart icon reader
        role: icon_read
        script: |
          set -eu
          sudo chmod 0755 /usr/local/bin/isupipe-icon-read
          sudo systemctl daemon-reload
          sudo systemctl enable isupipe-icons
          sudo systemctl restart isupipe-icons
          sudo systemctl is-active --quiet isupipe-icons

  nginx:
    uploads:
      - {label: nginx configuration, role: nginx, local: nginx/, remote: /etc/nginx/, excludes: [tls/], delete: true, validate: sudo nginx -t}
      - {label: public assets, role: nginx, local: webapp/public/, remote: /home/isucon/webapp/public/, delete: true}
    activations:
      - label: reload or start nginx
        role: nginx
        script: |
          set -eu
          if sudo systemctl is-active --quiet nginx; then
            sudo systemctl reload nginx
          else
            sudo systemctl enable --now nginx
          fi
          sudo systemctl is-active --quiet nginx
          curl --fail --silent --show-error --max-time 10 --cacert /etc/nginx/tls/_.u.isucon.dev.crt --resolve pipe.u.isucon.dev:443:127.0.0.1 https://pipe.u.isucon.dev/api/tag >/dev/null
          curl --fail --silent --show-error --max-time 10 --cacert /etc/nginx/tls/_.u.isucon.dev.crt --resolve pipe.u.isucon.dev:443:127.0.0.1 https://pipe.u.isucon.dev/ >/dev/null

  nginx-retire:
    activations:
      - label: stop nginx on the application host after DNS switches
        role: app
        script: |
          set -eu
          case ',{var:nginx_hosts},' in
            *',{host},'*) ;;
            *) sudo systemctl disable --now nginx; test "$(sudo systemctl show nginx -p MainPID --value)" = 0 ;;
          esac

  ingress-dns:
    uploads:
      - {label: DNS topology environment, role: dns, local: tools/contest/generated/topology.env, remote: /home/isucon/topology.env}
      - {label: PowerDNS configuration, role: dns, local: 'etc/hosts/{host}/powerdns/', remote: /etc/powerdns/, delete: true, validate: 'sudo pdns_server --config=check'}
      - {label: PowerDNS systemd drop-in, role: dns, local: etc/systemd/system/pdns.service.d/, remote: /etc/systemd/system/pdns.service.d/}
      - {label: DNS update owner, role: dns, local: '{var:app_dir}/isupipe', remote: /usr/local/bin/isupipe-dns-control}
      - {label: DNS update unit, role: dns, local: etc/systemd/system/isupipe-dns.service, remote: /etc/systemd/system/isupipe-dns.service}
    activations:
      - label: publish the new ingress while preserving registered names
        role: dns
        script: |
          set -eu
          sudo chmod 0755 /usr/local/bin/isupipe-dns-control
          sudo systemctl daemon-reload
          sudo systemctl restart isupipe-dns
          sudo systemctl restart pdns
          sudo systemctl is-active --quiet isupipe-dns pdns

  topology-config:
    uploads:
      - &topology_env {label: topology environment, role: all, local: tools/contest/generated/topology.env, remote: /home/isucon/topology.env}
      - &pdns_config {label: host-specific PowerDNS configuration, role: all, local: 'etc/hosts/{host}/powerdns/', remote: /etc/powerdns/, delete: true, validate: 'sudo pdns_server --config=check'}
      - &pdns_unit {label: PowerDNS systemd drop-in, role: all, local: etc/systemd/system/pdns.service.d/, remote: /etc/systemd/system/pdns.service.d/}
      - &dns_binary {label: DNS update owner, role: dns, local: '{var:app_dir}/isupipe', remote: /usr/local/bin/isupipe-dns-control}
      - &dns_owner_unit {label: DNS update unit, role: dns, local: etc/systemd/system/isupipe-dns.service, remote: /etc/systemd/system/isupipe-dns.service}
    activations:
      - label: reload topology units
        role: all
        script: |
          set -eu
          if [ -f /usr/local/bin/isupipe-dns-control ]; then sudo chmod 0755 /usr/local/bin/isupipe-dns-control; fi
          sudo rm -f /usr/local/bin/isupipe-init-zone-once.sh
          sudo systemctl daemon-reload

  app:
    uploads:
      - &app_code {label: application, role: app, local: '{var:app_dir}/', remote: '{var:remote_home}/{var:app_dir}/', delete: true, excludes: ['*.pprof', default.pgo]}
      - &app_unit {label: systemd unit, role: app, local: 'etc/systemd/system/{var:service}.service', remote: '/etc/systemd/system/{var:service}.service'}
      - &app_sql {label: application initialization SQL, role: app, local: '{var:sql_dir}/', remote: '{var:remote_home}/{var:sql_dir}/', delete: true}
      - &app_zone {label: application DNS initialization assets, role: app, local: webapp/pdns/, remote: '{var:remote_home}/webapp/pdns/', delete: true}
      - {label: application topology environment, role: app, local: tools/contest/generated/topology.env, remote: /home/isucon/topology.env}
    activations: &app_activation
      - label: restart application
        role: app
        script: |
          set -eu
          sudo chown -R {var:isucon_user}:{var:isucon_user} {var:remote_home}/{var:app_dir} {var:remote_home}/webapp/sql {var:remote_home}/webapp/pdns
          sudo install -d -o {var:isucon_user} -g {var:isucon_user} -m 0755 /var/lib/isupipe /var/lib/isupipe/icons /var/lib/isupipe/wal
          sudo systemctl daemon-reload
          sudo systemctl restart {var:service}
          sudo systemctl is-active --quiet {var:service}

  app-after-schema:
    uploads: [*app_code, *app_unit, *app_sql, *app_zone]
    activations: *app_activation

  app-stop:
    activations:
      - label: stop all application writers before reset
        role: all
        script: |
          set -eu
          sudo systemctl stop {var:service}
          test "$(sudo systemctl show {var:service} -p MainPID --value)" = 0
          test "$(sudo systemctl show {var:service} -p ActiveState --value)" = inactive

  pdns-config:
    uploads: [*topology_env, *pdns_config, *pdns_unit, *dns_binary, *dns_owner_unit]

  pdns:
    uploads: [*topology_env, *pdns_config, *pdns_unit, *dns_binary, *dns_owner_unit]
    activations: &dns_restart
      - label: restart DNS server
        role: dns
        script: |
          set -eu
          sudo systemctl daemon-reload
          sudo chmod 0755 /usr/local/bin/isupipe-dns-control
          sudo systemctl enable isupipe-dns
          sudo systemctl restart isupipe-dns
          sudo systemctl restart pdns
          sudo systemctl is-active --quiet pdns

  dns-restart:
    activations: *dns_restart

  db-access:
    uploads:
      - {label: remote database users, role: app_db, local: tools/contest/generated/remote-users.sql, remote: /home/isucon/remote-users.sql}
    activations:
      - label: grant database access to the application host
        role: app_db
        script: |
          set -eu
          sudo mysql < /home/isucon/remote-users.sql

  dns-stop:
    activations:
      - label: stop all DNS writers before reset
        role: all
        script: |
          set -eu
          sudo systemctl stop pdns
          test "$(sudo systemctl show pdns -p MainPID --value)" = 0
          test "$(sudo systemctl show pdns -p ActiveState --value)" = inactive
          if sudo systemctl cat isupipe-dns >/dev/null 2>&1; then sudo systemctl stop isupipe-dns; fi

  db-schema:
    uploads:
      - {label: application schema assets, role: app_db, local: '{var:sql_dir}/', remote: '{var:remote_home}/{var:sql_dir}/', delete: true}
    activations:
      - label: recreate application database and remove unused DNS SQL state
        role: app_db
        script: |
          set -eu
          sudo chown -R {var:isucon_user}:{var:isucon_user} {var:remote_home}/webapp/sql
          sudo mysql -e 'DROP DATABASE IF EXISTS isupipe; CREATE DATABASE isupipe; DROP DATABASE IF EXISTS isudns;'
          sudo mysql isupipe < {var:remote_home}/{var:sql_dir}/{var:sql_schema_file}

  dns-start:
    activations:
      - label: start DNS after schema recreation
        role: dns
        script: |
          set -eu
          sudo chmod 0755 /usr/local/bin/isupipe-dns-control
          sudo systemctl enable --now isupipe-dns
          sudo systemctl start pdns
          sudo systemctl is-active --quiet pdns

  app-initialize:
    activations:
      - label: initialize shared application and DNS data once
        role: app_init
        script: |
          set -eu
          curl --fail-with-body --silent --show-error --max-time 42 -X POST 'http://127.0.0.1:{var:listen_port}{var:initialize_path}'

  dns-roles:
    activations:
      - label: apply DNS server roles
        role: all
        script: |
          set -eu
          case ',{var:dns_hosts},' in
            *',{host},'*) sudo systemctl enable --now isupipe-dns pdns; sudo systemctl is-active --quiet pdns ;;
            *) sudo systemctl disable --now pdns ;;
          esac

plans:
  fast-paths-initialize:
    deployments:
      app-initialize: {}
  fast-paths:
    deployments:
      app: {}
      icon-read: {needs: [app]}
      nginx: {needs: [icon-read]}
  nginx-split:
    deployments:
      app: {}
      nginx: {needs: [app]}
      ingress-dns: {needs: [nginx]}
      nginx-retire: {needs: [ingress-dns]}
  deploy-all:
    deployments:
      topology-config: {}
      mysql: {needs: [topology-config]}
      db-access: {needs: [mysql]}
      dns-restart: {needs: [db-access]}
      app-after-schema: {needs: [dns-restart]}
      icon-read: {needs: [app-after-schema]}
      nginx: {needs: [icon-read]}
  db-recreate:
    deployments:
      topology-config: {}
      app-stop: {needs: [topology-config]}
      dns-stop: {needs: [app-stop]}
      roles-off: {needs: [dns-stop]}
      mysql: {needs: [roles-off]}
      db-access: {needs: [mysql]}
      db-schema: {needs: [db-access]}
      dns-start: {needs: [db-schema]}
      app-after-schema: {needs: [dns-start]}
      icon-read: {needs: [app-after-schema]}
      app-initialize: {needs: [icon-read]}
  roles:
    deployments:
      roles-off: {}
      roles-on: {needs: [roles-off]}
      dns-roles: {needs: [roles-on]}
