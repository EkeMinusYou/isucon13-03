# Contest-specific tasks for this competition's solution.
#
# Taskfile.yml includes this file with flatten:true, so these tasks are called
# without a namespace and read the generic file's vars. Task names must not
# collide with the generic file: Go Task rejects duplicates instead of
# overriding them. The generic side reaches this file only through hook tasks
# it declares (currently prepare-db-assets and gen-contest-routing); a contest
# that has nothing to do defines the hook here with no commands.
version: '3'

tasks:
  deploy-shared-wal-dry:
    desc: 共通WAL配布と競技データ初期化の対象・順序を表示する
    deps: [gen, build-deployctl]
    cmds:
      - task: prepare-db-assets
      - '{{.DEPLOYCTL_DIR}}/deployctl apply-plan shared-wal -dry-run -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'

  deploy-shared-wal:
    desc: 3号機へ共通WALを配布し公式初期化で競技データを作り直す
    preconditions:
      - sh: test ! -f '{{.RUN_STATE_FILE}}'
        msg: active benchmark exists
    deps: [gen, build, build-deployctl]
    cmds:
      - task: inspect-dns-batching-prereqs
      - task: prepare-db-assets
      - task: deploy-plan
        vars: { PLAN: shared-wal }

  inspect-shared-wal:
    desc: 共通WALの対象ホスト・画像容量・空き容量を読み取り確認する
    cmds:
      - task: inspect-dns-batching-prereqs
      - for: { var: APP_HOSTS }
        cmd: |
          {{.SSH}} {{.SSH_USER}}@{{.ITEM}} '
            set -eu
            echo "{{.ITEM}}: shared WAL and icon source"
            sudo du -sb /var/lib/isupipe/wal
            if test -d /var/lib/isupipe/icons; then
              sudo du -sb /var/lib/isupipe/icons
              sudo find /var/lib/isupipe/icons -maxdepth 1 -type f | wc -l
            fi
            df -B1 /var/lib/isupipe/wal
            findmnt -T /var/lib/isupipe/wal -o TARGET,FSTYPE,OPTIONS
            curl --fail --silent http://127.0.0.1:6060/debug/sql-pools
          '

  inspect-special-sauce:
    desc: 秘伝のタレの反映前に計測停止・ホスト上限・現行実効値を読み取り確認する
    preconditions:
      - sh: test ! -f '{{.RUN_STATE_FILE}}'
        msg: active benchmark exists
    deps: [build-measurectl]
    cmds:
      - '{{.MEASURECTL_DIR}}/measurectl collect check-clean {{.MEASURECTL_REMOTE}}'
      - for: { var: ALL_HOSTS }
        cmd: |
          {{.SSH}} {{.SSH_USER}}@{{.ITEM}} '
            set -eu
            echo "{{.ITEM}}"
            uname -sm
            free -m
            sysctl fs.nr_open net.core.somaxconn net.ipv4.ip_local_port_range net.core.rmem_max net.core.wmem_max
            test "$(sysctl -n fs.nr_open)" -ge 1006500
            if sudo systemctl is-active --quiet {{.SERVICE}}; then
              test "$(curl --fail --silent --max-time 5 http://127.0.0.1:6060/debug/profiles/status)" = "{\"cpu\":\"\",\"fgprof\":\"\"}"
              curl --fail --silent --max-time 5 http://127.0.0.1:6060/debug/sql-pools
            fi
          '
      - for: { var: MYSQL_HOSTS }
        cmd: |
          {{.SSH}} {{.SSH_USER}}@{{.ITEM}} '
            set -eu
            sudo mysql -e "SELECT VERSION(); SHOW VARIABLES WHERE Variable_name IN (\"innodb_buffer_pool_size\",\"innodb_flush_log_at_trx_commit\",\"innodb_flush_method\",\"log_bin\",\"max_connections\",\"open_files_limit\"); SELECT CHANNEL_NAME,SERVICE_STATE FROM performance_schema.replication_connection_status; SELECT CHANNEL_NAME,SERVICE_STATE FROM performance_schema.replication_applier_status;"
            sudo systemctl show mysql -p LimitNOFILE -p MemoryMax
            findmnt -T /var/lib/mysql -o TARGET,FSTYPE,OPTIONS
          '
      - for: { var: NGINX_HOSTS }
        cmd: |
          {{.SSH}} {{.SSH_USER}}@{{.ITEM}} '
            set -eu
            sudo systemctl show nginx -p LimitNOFILE -p LimitNOFILESoft
            sudo nginx -T 2>&1 | grep -E "worker_processes|worker_rlimit_nofile|worker_connections|multi_accept|tcp_nodelay|server_tokens|keepalive|proxy_http_version|proxy_set_header Connection"
          '

  check-special-sauce:
    desc: 秘伝のタレの反映後にsysctl・MySQL・nginxの実効値を確認する
    cmds:
      - for: { var: ALL_HOSTS }
        cmd: |
          {{.SSH}} {{.SSH_USER}}@{{.ITEM}} '
            set -eu
            test "$(sysctl -n net.core.somaxconn)" = 65535
            test "$(sysctl -n net.ipv4.ip_local_port_range | tr "\t" " ")" = "10000 60999"
            test "$(sysctl -n net.core.rmem_max)" = 16777216
            test "$(sysctl -n net.core.wmem_max)" = 16777216
            echo "{{.ITEM}}: kernel settings match"
          '
      - for: { var: MYSQL_HOSTS }
        cmd: |
          {{.SSH}} {{.SSH_USER}}@{{.ITEM}} '
            set -eu
            sudo systemctl is-active --quiet mysql
            test "$(sudo systemctl show mysql -p LimitNOFILE --value)" = 1006500
            pid=$(sudo systemctl show mysql -p MainPID --value)
            sudo awk "/Max open files/ {print; if (\$4 != 1006500 || \$5 != 1006500) exit 1}" "/proc/$pid/limits"
            actual=$(sudo mysql -N -e "SELECT @@innodb_buffer_pool_size,@@innodb_flush_log_at_trx_commit,@@innodb_flush_method,@@log_bin,@@max_connections")
            test "$actual" = "$(printf "1073741824\t2\tO_DIRECT\t0\t10000")"
            printf "buffer_pool_bytes\tflush_log_at_trx_commit\tflush_method\tlog_bin\tmax_connections\n%s\n" "$actual"
            sudo grep -E "VmRSS|FDSize" "/proc/$pid/status"
            sudo mysql -e "SHOW GLOBAL STATUS WHERE Variable_name IN (\"Threads_connected\",\"Max_used_connections\",\"Connection_errors_max_connections\",\"Aborted_connects\");"
            echo "{{.ITEM}}: MySQL settings and process limits match"
          '
      - for: { var: NGINX_HOSTS }
        cmd: |
          {{.SSH}} {{.SSH_USER}}@{{.ITEM}} '
            set -eu
            sudo systemctl is-active --quiet nginx
            sudo nginx -t
            sudo nginx -T 2>&1 | grep -E "worker_processes|worker_rlimit_nofile|worker_connections|multi_accept|sendfile|tcp_nopush|tcp_nodelay|types_hash_max_size|server_tokens|keepalive|proxy_http_version|proxy_set_header Connection"
            pid=$(sudo systemctl show nginx -p MainPID --value)
            workers=$(pgrep -P "$pid" -f "nginx: worker process")
            test -n "$workers"
            for worker in $workers; do
              sudo awk "/Max open files/ {print; if (\$4 != 16384 || \$5 != 16384) exit 1}" "/proc/$worker/limits"
              sudo grep -E "VmRSS|FDSize" "/proc/$worker/status"
            done
          '
      - task: check-roles
      - task: check-network

  setup-icon-edge-sources:
    desc: nginxとnjsの固定version sourceをローカルへ取得する
    status:
      - cd .task/icon-edge/sources && shasum -a 256 -c '{{.ROOT_DIR}}/tools/contest/nginx-njs/sources.sha256' >/dev/null
    cmds:
      - mkdir -p .task/icon-edge/sources
      - curl --fail --location --retry 2 --max-time 60 https://nginx.org/download/nginx-1.18.0.tar.gz -o .task/icon-edge/sources/nginx-1.18.0.tar.gz
      - curl --fail --location --retry 2 --max-time 60 https://codeload.github.com/nginx/njs/tar.gz/refs/tags/0.8.9 -o .task/icon-edge/sources/njs-0.8.9.tar.gz
      - cd .task/icon-edge/sources && shasum -a 256 -c '{{.ROOT_DIR}}/tools/contest/nginx-njs/sources.sha256'

  build-icon-edge-module:
    desc: 現行nginx用njs moduleをローカルLinux/amd64 Dockerでビルドする
    deps: [setup-icon-edge-sources]
    sources: [tools/contest/nginx-njs/Containerfile, tools/contest/nginx-njs/sources.sha256, tools/contest/nginx-njs/nginx-1.18-compat.patch, tools/contest/nginx-njs/icon-native.patch, tools/contest/nginx-njs/isupipe_icon_native.inc, tools/contest/nginx-njs/isupipe_icon_dict.inc]
    generates: [.task/icon-edge/build/ngx_http_js_module.so]
    cmds:
      - mkdir -p .task/icon-edge/docker
      - cp tools/contest/nginx-njs/nginx-1.18-compat.patch .task/icon-edge/sources/
      - cp tools/contest/nginx-njs/icon-native.patch tools/contest/nginx-njs/isupipe_icon_native.inc tools/contest/nginx-njs/isupipe_icon_dict.inc .task/icon-edge/sources/
      - DOCKER_CONFIG='{{.ROOT_DIR}}/.task/icon-edge/docker' docker build --platform linux/amd64 -f tools/contest/nginx-njs/Containerfile -t isucon-icon-edge:local .task/icon-edge/sources
      - mkdir -p .task/icon-edge/build
      - docker run --rm --platform linux/amd64 -v '{{.ROOT_DIR}}/.task/icon-edge/build:/output' isucon-icon-edge:local sh -c 'cp /build/nginx-1.18.0/objs/ngx_http_js_module.so /output/; sha256sum /output/ngx_http_js_module.so'

  check-icon-edge-local:
    desc: 実nginxの2 workerとLinux Goで直接304・公開・期限・再起動を検証する
    deps: [build, build-icon-edge-module]
    cmds:
      - docker run --rm --platform linux/amd64 -v '{{.ROOT_DIR}}/nginx/njs:/etc/nginx/njs:ro' -v '{{.ROOT_DIR}}/tools/contest/nginx-njs:/checks:ro' -v '{{.ROOT_DIR}}/{{.APP_DIR}}/{{.APP_NAME}}:/app/isupipe:ro' isucon-icon-edge:local python3 /checks/check.py

  check-viewer-latency-local:
    desc: 検索・閲覧JSONのgzipとネイティブ304の正当性を確認する（競技ベンチなし）
    cmds:
      - node tools/contest/nginx-njs/publish_test.mjs
      - cd '{{.APP_DIR}}' && go test -race ./... -run 'Test(ResponseJSON|TimelineGzip)'
      - task: check-icon-edge-local

  deploy-viewer-latency-dry:
    desc: Goのgzipと両nginxのネイティブ304の配布・再起動対象を表示する
    deps: [gen, build-deployctl]
    cmds:
      - '{{.DEPLOYCTL_DIR}}/deployctl apply app -dry-run -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'
      - '{{.DEPLOYCTL_DIR}}/deployctl apply icon-edge-module -dry-run -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'
      - '{{.DEPLOYCTL_DIR}}/deployctl apply-plan viewer-latency -dry-run -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'

  deploy-viewer-latency:
    desc: 3号機のGoと1・2号機のネイティブ304 module・設定を配布して再起動する
    preconditions:
      - sh: test ! -f '{{.RUN_STATE_FILE}}'
        msg: active benchmark exists
    cmds:
      - task: inspect-fast-paths
      - task: build-icon-edge-module
      - task: deploy-app
      - '{{.DEPLOYCTL_DIR}}/deployctl apply icon-edge-module -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'
      - task: deploy-plan
        vars: { PLAN: viewer-latency }
      - task: check-icon-edge
      - task: check-app-deployment
        vars: { ICON_EDGE_CHECK: 'true' }

  deploy-icon-edge:
    desc: 1号機nginx・icon readerと3号機通知先を配布し更新・初期化・再起動を確認する
    preconditions:
      - sh: test ! -f '{{.RUN_STATE_FILE}}'
        msg: active benchmark exists
    cmds:
      - task: inspect-fast-paths
      - task: build-icon-edge-module
      - task: gen
      - task: build
      - task: deploy-plan
        vars: { PLAN: icon-edge }
      - task: check-icon-read
      - task: check-app-deployment
        vars: { ICON_SMOKE_PHASE: write, ICON_EDGE_CHECK: 'true' }
      - task: restart-icon-edge-check
      - task: deploy-app
      - task: check-icon-read
      - task: check-app-deployment
        vars: { ICON_SMOKE_PHASE: read, ICON_EDGE_CHECK: 'true' }
      - task: deploy-plan
        vars: { PLAN: fast-paths-initialize }
      - task: check-app-deployment
        vars: { ICON_EDGE_CHECK: 'true' }
      - task: check-icon-read
      - task: check-icon-edge
      - task: deploy-dns
      - task: check-role-split

  deploy-icon-edge-dry:
    desc: icon edgeの配布先とサービス操作の順序を表示する
    deps: [gen, build-deployctl]
    cmds:
      - '{{.DEPLOYCTL_DIR}}/deployctl apply-plan icon-edge -dry-run -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'

  check-icon-edge:
    desc: 実nginxのmoduleと共有辞書の公開状態を確認する
    vars:
      MODULE_SHA256:
        sh: shasum -a 256 .task/icon-edge/build/ngx_http_js_module.so | cut -d ' ' -f 1
    cmds:
      - for: { var: NGINX_HOSTS }
        cmd: |
          {{.SSH}} {{.SSH_USER}}@{{.ITEM}} '
            set -eu
            actual=$(sudo sha256sum /etc/nginx/ngx_http_js_module.so | cut -d " " -f 1)
            test "$actual" = "{{.MODULE_SHA256}}"
            sudo nginx -t
            curl --fail --silent http://127.0.0.1:8055/status
          ' | python3 -c 'import json, sys; s = json.load(sys.stdin); print(json.dumps(s)); assert s["fresh"] and not s["dirty"] and not s["locked"] and s["users"] > 0 and s["free_bytes"] > 0, s'

  restart-icon-edge-check:
    internal: true
    cmds:
      - '{{.SSH}} {{.SSH_USER}}@{{.ENTRY_HOST}} ''sudo systemctl restart isupipe-icons && sudo systemctl restart nginx'''

  check-fast-paths:
    desc: WAL同期境界・認証・アイコン同期とsnapshot指標のローカル検証
    deps: [build-sql-pool-metrics]
    cmds:
      - cd '{{.APP_DIR}}' && go test -race ./...
      - cd '{{.SQL_POOL_METRICS_DIR}}' && go test ./...

  inspect-fast-paths:
    desc: 配布対象・計測停止と共有セッション署名鍵の一致を確認する
    cmds:
      - task: inspect-dns-batching-prereqs
      - mkdir -p .task
      - for: { var: APP_HOSTS }
        cmd: '{{.SSH}} {{.SSH_USER}}@{{.ITEM}} "sudo -u {{.ISUCON_USER}} bash -s" < tools/contest/session-key-fingerprint.sh > .task/session-key-app.sha'
      - for: { var: ICON_READ_HOSTS }
        cmd: |
          {{.SSH}} {{.SSH_USER}}@{{.ITEM}} "sudo -u {{.ISUCON_USER}} bash -s" < tools/contest/session-key-fingerprint.sh > .task/session-key-reader.sha
          cmp .task/session-key-app.sha .task/session-key-reader.sha

  deploy-fast-paths-dry:
    desc: WAL・署名Cookie・アイコン読取りの配布先と起動順を表示する
    deps: [gen, build-deployctl]
    cmds:
      - '{{.DEPLOYCTL_DIR}}/deployctl apply-plan fast-paths -dry-run -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'

  deploy-fast-paths:
    desc: 3号機Go・1号機アイコン読取りとnginxを配布して永続性を確認する
    preconditions:
      - sh: test ! -f '{{.RUN_STATE_FILE}}'
        msg: active benchmark exists
    cmds:
      - task: inspect-fast-paths
      - task: build-icon-edge-module
      - task: gen
      - task: build
      - task: inspect-post-wal
      - task --silent inspect-writer-data > .task/fast-paths-data-before.tsv
      - task: deploy-plan
        vars: { PLAN: fast-paths }
      - task --silent inspect-writer-data > .task/fast-paths-data-after.tsv
      - diff .task/fast-paths-data-before.tsv .task/fast-paths-data-after.tsv
      - task: deploy-plan
        vars: { PLAN: fast-paths-initialize }
      - task: check-app-deployment
        vars: { ICON_SMOKE_PHASE: write, MUTATIONS_SMOKE_PHASE: write }
      - task: deploy-app
      - task: deploy-icon-read
      - task: check-app-deployment
        vars: { ICON_SMOKE_PHASE: read, MUTATIONS_SMOKE_PHASE: read }
      - task: inspect-post-wal
      - task: check-icon-read
      - task: check-role-split

  deploy-icon-read:
    desc: ICON_READ_HOSTSへアイコン読取りサービスを配布・再起動する
    preconditions:
      - sh: test ! -f '{{.RUN_STATE_FILE}}'
        msg: active benchmark exists
    deps: [gen, build, build-deployctl]
    cmds:
      - '{{.DEPLOYCTL_DIR}}/deployctl apply icon-read -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'

  check-icon-read:
    desc: アイコン読取りの実行バイナリとメモリ同期状態を確認する
    vars:
      BINARY_SHA256:
        sh: shasum -a 256 '{{.APP_DIR}}/{{.APP_NAME}}' | cut -d ' ' -f 1
    cmds:
      - for: { var: ICON_READ_HOSTS }
        cmd: |
          {{.SSH}} {{.SSH_USER}}@{{.ITEM}} '
            set -eu
            pid=$(sudo systemctl show isupipe-icons -p MainPID --value)
            test "$pid" -gt 0
            actual=$(sudo sha256sum "/proc/$pid/exe" | cut -d " " -f 1)
            test "$actual" = "{{.BINARY_SHA256}}"
            sudo systemctl is-enabled --quiet isupipe-icons
            curl --fail --silent http://{{index .IP .ITEM}}:{{.ICON_READ_PORT}}/_internal/status
          ' | python3 -c 'import json, sys; state = json.load(sys.stdin); print(json.dumps(state)); assert state["fresh"] and state["users"] > 0 and state["epoch"], state'

  deploy-wal-primary:
    desc: 統一WALを配布し、DB再作成・初期化・DBとアプリ再起動後のAPI状態を確認する
    preconditions:
      - sh: test ! -f '{{.RUN_STATE_FILE}}'
        msg: active benchmark exists
    cmds:
      - task: inspect-dns-batching-prereqs
      - task: gen
      - task: build
      - task: db-recreate
      - task: check-app-deployment
        vars: { MUTATIONS_SMOKE_PHASE: write }
      - task: inspect-post-wal
      - task: deploy-mysql
      - task: deploy-app
      - task: check-app-deployment
        vars: { MUTATIONS_SMOKE_PHASE: read }
      - task: inspect-post-wal
      - task: check-icon-read
      - task: check-role-split

  deploy-wal-posts:
    desc: 投稿WALを配布し、DB再作成・公式初期化・再起動後の永続性を確認する
    preconditions:
      - sh: test ! -f '{{.RUN_STATE_FILE}}'
        msg: active benchmark exists
    cmds:
      - task: inspect-dns-batching-prereqs
      - task: gen
      - task: build
      - task: db-recreate
      - task: check-app-deployment
        vars: { MUTATIONS_SMOKE_PHASE: write }
      - task: inspect-post-wal
      - mkdir -p .task
      - task --silent inspect-writer-data > .task/wal-posts-persisted-before.tsv
      - task: deploy-app
      - task: check-app-deployment
        vars: { MUTATIONS_SMOKE_PHASE: read }
      - task: inspect-post-wal
      - task --silent inspect-writer-data > .task/wal-posts-persisted-after.tsv
      - diff .task/wal-posts-persisted-before.tsv .task/wal-posts-persisted-after.tsv
      - task: check-role-split

  inspect-post-wal:
    desc: WAL世代・公開位置・容量・同期回数を読み取り確認する
    cmds:
      - for: { var: APP_HOSTS }
        cmd: |
          {{.SSH}} {{.SSH_USER}}@{{.ITEM}} '
            set -eu
            curl --fail --silent http://127.0.0.1:6060/debug/sql-pools
          '
      - |
        {{.SSH}} {{.SSH_USER}}@{{.MYSQL_HOST}} 'sudo mysql -t {{.DB_NAME}} -e "SELECT generation,ready FROM post_wal_state WHERE id=1"'

  build-bulk-writes:
    desc: 一括writerと永続化確認用smokeを対象OS/Archへビルドする
    cmds:
      - task: build
      - task: build-smoke

  deploy-bulk-writes:
    desc: 一括writerとMySQLのbinlog無効化を反映し、再起動後の保存内容を確認する
    preconditions:
      - sh: test ! -f '{{.RUN_STATE_FILE}}'
        msg: active benchmark exists
    cmds:
      - task: inspect-dns-batching-prereqs
      - task: build-bulk-writes
      - mkdir -p .task
      - task --silent inspect-writer-data > .task/bulk-writes-data-before.tsv
      - task: deploy-mysql
      - task: check-bulk-writes-mysql
      - task: deploy-app
      - task: check-app-deployment
      - task --silent inspect-writer-data > .task/bulk-writes-data-after.tsv
      - diff .task/bulk-writes-data-before.tsv .task/bulk-writes-data-after.tsv
      - task: check-app-deployment
        vars: { MUTATIONS_SMOKE_PHASE: write }
      - task --silent inspect-writer-data > .task/bulk-writes-persisted-before.tsv
      - task: deploy-mysql
      - task: check-bulk-writes-mysql
      - task: deploy-app
      - task: check-app-deployment
        vars: { MUTATIONS_SMOKE_PHASE: read }
      - task --silent inspect-writer-data > .task/bulk-writes-persisted-after.tsv
      - diff .task/bulk-writes-persisted-before.tsv .task/bulk-writes-persisted-after.tsv

  check-bulk-writes-mysql:
    desc: binlog無効化とInnoDBのログ書込み設定、採番条件を読み取り確認する
    cmds:
      - |
        {{.SSH}} {{.SSH_USER}}@{{.MYSQL_HOST}} '
          set -eu
          actual=$(sudo mysql -N -e "SELECT @@log_bin,@@innodb_flush_log_at_trx_commit,@@auto_increment_increment,@@auto_increment_offset")
          test "$actual" = "$(printf "0\t2\t1\t1")"
          echo "MySQL: binlog OFF, InnoDB flush_log_at_trx_commit 2, increment/offset 1"
        '

  deploy-nginx-split-dry:
    desc: nginx移設の配布先と起動順を実行せず表示する
    deps: [build-deployctl]
    cmds:
      - task: gen
      - task: build
      - '{{.DEPLOYCTL_DIR}}/deployctl apply-plan nginx-split -dry-run -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'

  deploy-dual-ingress-dry:
    desc: 2台入口の配布先とDNS切替までのサービス操作を表示する
    deps: [gen, build-deployctl]
    cmds:
      - '{{.DEPLOYCTL_DIR}}/deployctl apply icon-edge-module -dry-run -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'
      - '{{.DEPLOYCTL_DIR}}/deployctl apply-plan dual-ingress -dry-run -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'

  deploy-dual-ingress:
    desc: 1・2号機のHTTPS入口とreader、3号機の通知先、1号機のDNSを反映する
    preconditions:
      - sh: test ! -f '{{.RUN_STATE_FILE}}'
        msg: active benchmark exists
    cmds:
      - task: inspect-nginx-split-prereqs
      - task: inspect-fast-paths
      - task: build-icon-edge-module
      - task: gen
      - task: build
      - '{{.DEPLOYCTL_DIR}}/deployctl apply icon-edge-module -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'
      - task: deploy-plan
        vars: { PLAN: dual-ingress }
      - task: check-role-split
      - task: check-icon-read
      - task: check-icon-edge
      - task: check-app-deployment
        vars: { ICON_SMOKE_PHASE: write, ICON_EDGE_CHECK: 'true', CROSS_INGRESS_CHECK: 'true' }

  check-dual-ingress-local:
    desc: DNS分岐・通知fanout・ACLをrace検証し、Linux/amd64の疎通ツールをbuildする
    deps: [build-smoke]
    cmds:
      - task: check-fast-paths

  inspect-nginx-split-prereqs:
    desc: 計測停止・OS/Arch・移設先の証明書を読み取り確認する
    cmds:
      - task: inspect-dns-batching-prereqs
      - for: { var: NGINX_HOSTS }
        cmd: |
          {{.SSH}} {{.SSH_USER}}@{{.ITEM}} '
            set -eu
            test -r /etc/nginx/tls/_.u.isucon.dev.crt
            sudo test -r /etc/nginx/tls/_.u.isucon.dev.key
            test -r /etc/nginx/tls/_.t.isucon.dev.crt
            sudo test -r /etc/nginx/tls/_.t.isucon.dev.key
            echo "{{.ITEM}}: ingress certificates exist"
          '
      - |
        {{.SSH}} {{.SSH_USER}}@{{.MYSQL_HOST}} '
          sudo mysql -N {{.DB_NAME}} -e "SELECT COUNT(*) AS registration_smoke_account FROM users WHERE name=\"role-split-smoke\""
        '

  inspect-dns-registration-state:
    desc: DNS世代・serial・登録件数を読み取り再起動前後で比較する
    cmds:
      - for: { var: DNS_HOSTS }
        cmd: |
          {{.SSH}} {{.SSH_USER}}@{{.ITEM}} '
            curl --fail --silent http://{{.DNS_IP}}:{{.DNS_CONTROL_PORT}}/status | python3 -c "import json,sys; s=json.load(sys.stdin); print(s[\"epoch\"],s[\"serial\"],s[\"dynamic_names\"],s[\"entries\"],s[\"log_bytes\"])"
          '

  deploy-nginx-split:
    desc: nginxをDNSホストへ移設し、既存DBとDNS登録を保持して入口を切り替える
    preconditions:
      - sh: test ! -f '{{.RUN_STATE_FILE}}'
        msg: active benchmark exists
    cmds:
      - task: inspect-nginx-split-prereqs
      - task: gen
      - task: build
      - mkdir -p .task
      - task --silent inspect-writer-data > .task/nginx-split-data-before.tsv
      - task --silent inspect-dns-registration-state > .task/nginx-split-dns-before.tsv
      - task: deploy-plan
        vars: { PLAN: nginx-split }
      - task: check-role-split
      - task: check-app-deployment
      - task --silent inspect-writer-data > .task/nginx-split-data-after.tsv
      - task --silent inspect-dns-registration-state > .task/nginx-split-dns-after.tsv
      - diff .task/nginx-split-data-before.tsv .task/nginx-split-data-after.tsv
      - diff .task/nginx-split-dns-before.tsv .task/nginx-split-dns-after.tsv
      - task: check-app-deployment
        vars: { ICON_SMOKE_PHASE: write, REGISTRATION_SMOKE_PHASE: '{{.REGISTRATION_SMOKE_PHASE | default "write"}}' }
      - task: deploy-app
      - task: check-app-deployment
        vars: { ICON_SMOKE_PHASE: read, REGISTRATION_SMOKE_PHASE: read }

  inspect-dns-batching-prereqs:
    desc: DNS・DB・アプリのOS/Archと計測停止を確認する
    preconditions:
      - sh: test ! -f '{{.RUN_STATE_FILE}}'
        msg: active benchmark exists
    deps: [build-measurectl]
    cmds:
      - '{{.MEASURECTL_DIR}}/measurectl collect check-clean {{.MEASURECTL_REMOTE}}'
      - for: { var: ALL_HOSTS }
        cmd: |
          {{.SSH}} {{.SSH_USER}}@{{.ITEM}} '
            set -eu
            test "$(uname -s)" = Linux
            test "$(uname -m)" = x86_64
            printf "{{.ITEM}}: Linux/amd64\n"
            if sudo systemctl is-active --quiet {{.SERVICE}}; then
              test "$(curl --fail --silent http://127.0.0.1:6060/debug/profiles/status)" = "{\"cpu\":\"\",\"fgprof\":\"\"}"
            fi
          '

  deploy-go-dns:
    desc: Go権威DNSと差分ログを配布し、初期化・登録・再起動後の復元を確認する
    cmds:
      - task: inspect-dns-batching-prereqs
      - task: config-check-dns
      - task: check-dns-linux
      - task: gen
      - task: build
      - task: db-recreate
      - task: check-app-deployment
        vars: { ICON_SMOKE_PHASE: write, REGISTRATION_SMOKE_PHASE: write }
      - mkdir -p .task
      - task --silent inspect-dns-registration-state > .task/go-dns-before.tsv
      - task: deploy-dns
      - task --silent inspect-dns-registration-state > .task/go-dns-after.tsv
      - diff .task/go-dns-before.tsv .task/go-dns-after.tsv
      - task: check-app-deployment
        vars: { ICON_SMOKE_PHASE: read, REGISTRATION_SMOKE_PHASE: read }
      - task: check-role-split
      - task: deploy-dns-initialize
      - task: check-dns-reset
      - task: check-app-deployment
      - task: check-icon-read

  deploy-dns-initialize:
    desc: 公式initializeで競技DB・DNS・アイコンを初期状態に再作成する
    preconditions:
      - sh: test ! -f '{{.RUN_STATE_FILE}}'
        msg: active benchmark exists
    cmds:
      - task: deploy-plan
        vars: { PLAN: fast-paths-initialize }

  check-dns-reset:
    desc: 公式初期化による動的DNS登録の消去と初期名の保持を確認する
    cmds:
      - task: check-dns
      - for: { var: DNS_HOSTS }
        cmd: |
          {{.SSH}} {{.SSH_USER}}@{{.ITEM}} '
            set -eu
            curl --fail --silent http://{{.DNS_IP}}:{{.DNS_CONTROL_PORT}}/status | python3 -c "import json,sys; s=json.load(sys.stdin); assert s[\"ready\"] and s[\"dynamic_names\"] == 0 and s[\"log_bytes\"] == 32"
            dig +time=2 +tries=1 role-split-smoke.u.isucon.dev @127.0.0.1 | grep -q "status: NXDOMAIN"
          '

  inspect-writer-data:
    desc: 配布前後で比較する競技DBの件数・tipを読み取る
    cmds:
      - |
        {{.SSH}} {{.SSH_USER}}@{{.MYSQL_HOST}} '
          sudo mysql -N {{.DB_NAME}} -e "
            SELECT \"users\",COUNT(*) FROM users
            UNION ALL SELECT \"livestreams\",COUNT(*) FROM livestreams
            UNION ALL SELECT \"livecomments\",COUNT(*) FROM livecomments
            UNION ALL SELECT \"reactions\",COUNT(*) FROM reactions
            UNION ALL SELECT \"reports\",COUNT(*) FROM livecomment_reports
            UNION ALL SELECT \"ng_words\",COUNT(*) FROM ng_words
            UNION ALL SELECT \"viewers\",COUNT(*) FROM livestream_viewers_history
            UNION ALL SELECT \"icons\",COUNT(*) FROM icons
            UNION ALL SELECT \"total_tip\",COALESCE(SUM(tip),0) FROM livecomments;
          "
        '

  deploy-parallel-writers:
    desc: 配信別writerをGoホストへ配布し、保存済みデータと認証APIを確認する
    cmds:
      - task: check-reference-model-prereqs
      - mkdir -p .task
      - task --silent inspect-writer-data > .task/parallel-writers-data-before.tsv
      - task: deploy-app
      - task: check-app-deployment
      - task: check-network
      - task --silent inspect-writer-data > .task/parallel-writers-data-after.tsv
      - diff .task/parallel-writers-data-before.tsv .task/parallel-writers-data-after.tsv


  check-reference-model-prereqs:
    desc: 参照モデルの変更前に計測停止と対象OS/Archを確認する
    preconditions:
      - sh: test ! -f '{{.RUN_STATE_FILE}}'
        msg: active benchmark exists
    deps: [build-measurectl, build-smoke]
    cmds:
      - '{{.MEASURECTL_DIR}}/measurectl collect check-clean {{.MEASURECTL_REMOTE}}'
      - for: { var: APP_HOSTS }
        cmd: |
          {{.SSH}} {{.SSH_USER}}@{{.ITEM}} '
            set -eu
            test "$(uname -s)" = Linux
            test "$(uname -m)" = x86_64
            test "$(curl --fail --silent http://127.0.0.1:6060/debug/profiles/status)" = "{\"cpu\":\"\",\"fgprof\":\"\"}"
            echo "{{.ITEM}}: Linux/amd64, no active profiles"
          '

  deploy-reference-model:
    desc: 参照モデルを配布し、公式初期化・更新反映・アプリ再起動後の復元を確認する
    preconditions:
      - sh: test ! -f '{{.RUN_STATE_FILE}}'
        msg: active benchmark exists
    cmds:
      - task: check-reference-model-prereqs
      - task: gen
      - task: build
      - task: db-recreate
      - task: check-app-deployment
        vars: { ICON_SMOKE_PHASE: write, REGISTRATION_SMOKE_PHASE: write, REFERENCES_SMOKE_PHASE: write }
      - task: deploy-app
      - task: check-app-deployment
        vars: { ICON_SMOKE_PHASE: read, REGISTRATION_SMOKE_PHASE: read, REFERENCES_SMOKE_PHASE: read }
      - task: check-role-split

  inspect-role-split-prereqs:
    desc: 全ホストのOS/Arch・firewallと移行先DBの接続ユーザーを読み取り確認する
    cmds:
      - for: { var: ALL_HOSTS }
        cmd: |
          {{.SSH}} {{.SSH_USER}}@{{.ITEM}} '
            set -eu
            uname -sm
            sudo ufw status
            if [ "{{.ITEM}}" = "{{.MYSQL_HOST}}" ]; then
              sudo mysql -N -e "SELECT User,Host FROM mysql.user WHERE User IN (\"isucon\",\"isudns\")"
            fi
          '

  deploy-role-split:
    desc: DNS・共有DB・Go/nginxを役割分離し、競技DB再作成・初期化・永続性確認まで行う
    preconditions:
      - sh: test ! -f '{{.RUN_STATE_FILE}}'
        msg: active benchmark exists
    deps: [build-measurectl]
    cmds:
      - '{{.MEASURECTL_DIR}}/measurectl collect check-clean {{.MEASURECTL_REMOTE}}'
      - for: { var: ALL_HOSTS }
        cmd: |
          {{.SSH}} {{.SSH_USER}}@{{.ITEM}} '
            set -eu
            test "$(uname -s)" = Linux
            test "$(uname -m)" = x86_64
            if sudo systemctl is-active --quiet {{.SERVICE}}; then
              test "$(curl --fail --silent http://127.0.0.1:6060/debug/profiles/status)" = "{\"cpu\":\"\",\"fgprof\":\"\"}"
            fi
          '
      - task: gen
      - task: build
      - task: db-recreate
      - task: deploy-nginx
      - task: apply-roles
      - task: check-role-split
      - task: check-app-deployment
        vars: { ICON_SMOKE_PHASE: write, REGISTRATION_SMOKE_PHASE: write }
      - task: deploy-all
      - task: check-app-deployment
        vars: { ICON_SMOKE_PHASE: read, REGISTRATION_SMOKE_PHASE: read }
      - task: check-role-split

  deploy-role-split-dry:
    desc: 役割分離のDB再作成・配布・起動順を実行せず表示する
    cmds:
      - task: gen
      - task: build
      - task: db-recreate-dry
      - task: deploy-all-dry

  check-role-split:
    desc: 役割分離後のサービス・DB接続・DNS応答を確認する
    cmds:
      - task: check-roles
      - task: check-network
      - task: check-dns

  check-icon-unit:
    desc: 永続アイコン・条件付きGETのローカルrace testを実行する
    dir: '{{.APP_DIR}}'
    cmds: [go test -race ./...]

  deploy-icons:
    desc: 永続アイコン構成を配布し、DB再作成・初期化・nginx reload・再起動後の画像確認を行う
    preconditions:
      - sh: test ! -f '{{.RUN_STATE_FILE}}'
        msg: active benchmark exists
    deps: [build-measurectl]
    cmds:
      - '{{.MEASURECTL_DIR}}/measurectl collect check-clean {{.MEASURECTL_REMOTE}}'
      - task: gen
      - task: build
      - task: db-recreate
      - task: deploy-nginx
      - task: check-icons-deployment

  check-icons-deployment:
    desc: nginx経由の画像・条件付きGET・アプリ再起動後の永続性を確認する
    preconditions:
      - sh: test ! -f '{{.RUN_STATE_FILE}}'
        msg: active benchmark exists
    cmds:
      - task: check-app-deployment
        vars: { ICON_SMOKE_PHASE: write }
      - task: deploy-app
      - '{{.SSH}} {{.SSH_USER}}@{{.ENTRY_HOST}} ''{{.SMOKE_REMOTE_DIR}}/smoke {{.SMOKE_ARGS}} -icons-phase read'''

  check-app-improvements:
    desc: アイコン・応答・同時予約・統計・モデレーションを実MySQLの一時検証DBで確認する（競技DBは変更しない）
    preconditions:
      - sh: test ! -f '{{.RUN_STATE_FILE}}'
        msg: active benchmark exists
    deps: [build-measurectl]
    cmds:
      - '{{.MEASURECTL_DIR}}/measurectl collect check-clean {{.MEASURECTL_REMOTE}}'
      - for: { var: APP_HOSTS }
        cmd: '{{.SSH}} {{.SSH_USER}}@{{.ITEM}} ''test "$(curl --fail --silent http://127.0.0.1:6060/debug/profiles/status)" = "{\"cpu\":\"\",\"fgprof\":\"\"}"'''
      - mkdir -p .task/app-improvements
      - cd '{{.APP_DIR}}' && {{.GO_BUILD_ENV}} go test -c -o '{{.ROOT_DIR}}/.task/app-improvements/app.test' .
      - for: { var: MYSQL_HOSTS }
        cmd: |
          {{.SSH}} {{.SSH_USER}}@{{.ITEM}} 'mkdir -p /tmp/isucon-app-improvements'
          {{.RSYNC}} .task/app-improvements/app.test {{.SSH_USER}}@{{.ITEM}}:/tmp/isucon-app-improvements/app.test
          {{.RSYNC}} '{{.SQL_DIR}}/{{.SQL_SCHEMA_FILE}}' {{.SSH_USER}}@{{.ITEM}}:/tmp/isucon-app-improvements/schema.sql
          {{.SSH}} {{.SSH_USER}}@{{.ITEM}} '
            set -eu
            test "$(uname -s)" = Linux
            test "$(uname -m)" = x86_64
            cd {{.REMOTE_HOME}}/{{.APP_DIR}}
            sudo env ISUCON_TEST_MYSQL_DSN="root@unix(/var/run/mysqld/mysqld.sock)/" \
              ISUCON_TEST_SCHEMA=/tmp/isucon-app-improvements/schema.sql \
              /tmp/isucon-app-improvements/app.test -test.v -test.run "^TestImprovementsMySQL$"
          '

  check-app-deployment:
    desc: 実行バイナリ・索引・各nginxの認証APIを確認する（ベンチ・計測なし）
    preconditions:
      - sh: test ! -f '{{.RUN_STATE_FILE}}'
        msg: active benchmark exists
    deps: [build-smoke]
    vars:
      BINARY_SHA256:
        sh: shasum -a 256 '{{.APP_DIR}}/{{.APP_NAME}}' | cut -d ' ' -f 1
    cmds:
      - for: { var: APP_HOSTS }
        cmd: |
          {{.SSH}} {{.SSH_USER}}@{{.ITEM}} '
            set -eu
            pid=$(sudo systemctl show {{.SERVICE}} -p MainPID --value)
            test "$pid" -gt 0
            actual=$(sudo sha256sum "/proc/$pid/exe" | cut -d " " -f 1)
            test "$actual" = "{{.BINARY_SHA256}}"
            echo "{{.ITEM}}: running binary matches"
          '
      - for: { var: MYSQL_HOSTS }
        cmd: |
          {{.SSH}} {{.SSH_USER}}@{{.ITEM}} '
            set -eu
            indexes=$(sudo mysql -N -e "SELECT COUNT(DISTINCT TABLE_NAME, INDEX_NAME) FROM information_schema.STATISTICS WHERE TABLE_SCHEMA=\"{{.DB_NAME}}\" AND INDEX_NAME LIKE \"idx_%\"")
            test "$indexes" -eq 10
            columns=$(sudo mysql -N -e "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=\"{{.DB_NAME}}\" AND ((TABLE_NAME=\"users\" AND COLUMN_NAME=\"icon_hash\") OR (TABLE_NAME=\"icons\" AND COLUMN_NAME=\"hash\"))")
            test "$columns" -eq 2
            blobs=$(sudo mysql -N -e "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=\"{{.DB_NAME}}\" AND TABLE_NAME=\"icons\" AND DATA_TYPE LIKE \"%blob\"")
            test "$blobs" -eq 0
            echo "{{.ITEM}}: all 10 indexes and icon metadata columns exist; no icon BLOB"
            sudo mysql -t {{.DB_NAME}} -e "EXPLAIN SELECT * FROM livestream_tags WHERE livestream_id = 1"
            sudo mysql -t {{.DB_NAME}} -e "EXPLAIN SELECT * FROM reservation_slots WHERE start_at >= 1700874000 AND start_at < 1700877600 AND end_at <= 1700877600 FOR UPDATE"
          '
      - '{{.SSH}} {{.SSH_USER}}@{{.ENTRY_HOST}} ''mkdir -p {{.SMOKE_REMOTE_DIR}}'''
      - '{{.RSYNC}} {{.SMOKE_TOOL_DIR}}/smoke {{.SSH_USER}}@{{.ENTRY_HOST}}:{{.SMOKE_REMOTE_DIR}}/smoke'
      - '{{.SSH}} {{.SSH_USER}}@{{.ENTRY_HOST}} ''{{.SMOKE_REMOTE_DIR}}/smoke {{.SMOKE_ARGS}} -icons-phase "{{.ICON_SMOKE_PHASE | default ""}}" -cross-ingress={{.CROSS_INGRESS_CHECK | default "false"}} -registration-phase "{{.REGISTRATION_SMOKE_PHASE | default ""}}" -references-phase "{{.REFERENCES_SMOKE_PHASE | default ""}}" -mutations-phase "{{.MUTATIONS_SMOKE_PHASE | default ""}}" -dns-server {{.DNS_IP}}:53 -dns-address {{.DNS_RECORD_ADDRESS}} -dns-common-address {{.DNS_COMMON_ADDRESS}}'''
      - for: { var: NGINX_HOSTS }
        cmd: |
          {{if eq (.ICON_EDGE_CHECK | default "false") "true"}}
          {{.SSH}} {{.SSH_USER}}@{{.ITEM}} 'mkdir -p {{.SMOKE_REMOTE_DIR}}'
          {{.RSYNC}} {{.SMOKE_TOOL_DIR}}/smoke {{.SSH_USER}}@{{.ITEM}}:{{.SMOKE_REMOTE_DIR}}/smoke
          {{.SSH}} {{.SSH_USER}}@{{.ITEM}} '{{.SMOKE_REMOTE_DIR}}/smoke -ingress 127.0.0.1:443 -icon-edge=true'
          {{end}}

  setup-contest-assets:
    desc: 競技固有の依存サービス資材を取得
    cmds: [{task: setup-dns}]

  prepare-db-assets:
    desc: deployへ載せる前にDB資材を生成・検証する（deploy系のhook、既定は何もしない）
    deps: [build-icon-edge-module]

  gen-contest-routing:
    desc: Taskfileの役割値からDB・DNS接続設定を生成する
    cmds:
      - mkdir -p tools/contest/generated
      - |
        cat > tools/contest/generated/topology.env <<'ENV'
        # GENERATED by task gen; host credentials remain in /home/isucon/env.sh.
        ISUCON13_MYSQL_DIALCONFIG_ADDRESS={{.MYSQL_IP}}
        ISUCON13_MYSQL_DIALCONFIG_PORT=3306
        ISUCON13_POWERDNS_SUBDOMAIN_ADDRESS={{.DNS_RECORD_ADDRESS}}
        ISUPIPE_DNS_URL=http://{{.DNS_IP}}:{{.DNS_CONTROL_PORT}}
        ISUPIPE_ICON_READ_IPS="{{.ICON_READ_IPS}}"
        ISUPIPE_ICON_READ_URLS="{{.ICON_READ_URLS}}"
        ISUPIPE_ICON_READ_SOCKET={{.ICON_READ_SOCKET}}
        ISUPIPE_ICON_EDGE_URL={{.ICON_EDGE_URL}}
        ISUPIPE_ICON_ORIGIN_IP={{.APP_ORIGIN_IP}}
        ISUPIPE_ICON_ORIGIN_URL=http://{{.APP_ORIGIN_IP}}:{{.LISTEN_PORT}}
        ENV
      - for: { var: ICON_READ_HOSTS }
        cmd: |
          mkdir -p etc/hosts/{{.ITEM}}
          cat > etc/hosts/{{.ITEM}}/icon-read.env <<'ENV'
          # GENERATED by task gen; each reader binds its own private address.
          ISUPIPE_ICON_READ_LISTEN={{index .IP .ITEM}}:{{.ICON_READ_PORT}}
          ENV
      - |
        cat > nginx/conf.d/icon-read.conf <<'CONF'
        # GENERATED by task gen-contest-routing.
        upstream icon_read {
          server unix:{{.ICON_READ_SOCKET}};
          server {{.APP_ORIGIN_IP}}:{{.LISTEN_PORT}} backup;
          keepalive 64;
        }
        CONF
      - |
        cat > mysql/mysql.conf.d/zz-topology.cnf <<'CNF'
        # GENERATED by task gen; listen on the database host's private address.
        [mysqld]
        bind-address={{.MYSQL_IP}}
        CNF
      - |
        cat > tools/contest/generated/dns-control.env <<'ENV'
        ISUPIPE_MODE=dns-control
        ISUPIPE_DNS_LISTEN={{.DNS_IP}}:{{.DNS_CONTROL_PORT}}
        ISUPIPE_DNS_CLIENTS={{.APP_IPS}}
        ISUCON13_POWERDNS_SUBDOMAIN_ADDRESS={{.DNS_RECORD_ADDRESS}}
        ISUPIPE_DNS_COMMON_ADDRESS={{.DNS_COMMON_ADDRESS}}
        ENV
      - for: { var: DNS_HOSTS }
        cmd: |
          mkdir -p etc/hosts/{{.ITEM}}/dns
          cp tools/contest/generated/dns-control.env etc/hosts/{{.ITEM}}/dns/isupipe-dns.env
          cp webapp/pdns/u.isucon.dev.zone etc/hosts/{{.ITEM}}/dns/u.isucon.dev.zone
      - |
        cat > tools/contest/generated/remote-users.sql <<'SQL'
        -- GENERATED by task gen. Reuse local authentication without exporting credentials.
        SELECT CONCAT('CREATE USER IF NOT EXISTS ', QUOTE(User), '@', QUOTE('{{index .IP (splitList " " .APP_HOSTS | first)}}'),
                      ' IDENTIFIED WITH ', plugin, ' AS ', QUOTE(authentication_string)) INTO @app_user_sql
        FROM mysql.user WHERE User = 'isucon' AND Host = 'localhost';
        PREPARE app_user FROM @app_user_sql;
        EXECUTE app_user;
        DEALLOCATE PREPARE app_user;
        GRANT ALL PRIVILEGES ON isupipe.* TO 'isucon'@'{{index .IP (splitList " " .APP_HOSTS | first)}}';
        SQL

  setup-dns:
    desc: Go DNSのホスト別設定・unitと環境を取得
    cmds:
      - for: { var: ALL_HOSTS }
        cmd: |
          mkdir -p etc/hosts/{{.ITEM}}
          {{.RSYNC}} {{.SSH_USER}}@{{.ITEM}}:{{.REMOTE_HOME}}/env.sh etc/hosts/{{.ITEM}}/env.sh
      - for: { var: DNS_HOSTS }
        cmd: |
          mkdir -p etc/hosts/{{.ITEM}}/dns
          {{.RSYNC}} {{.SSH_USER}}@{{.ITEM}}:/etc/isupipe-dns/ etc/hosts/{{.ITEM}}/dns/
          {{.RSYNC}} {{.SSH_USER}}@{{.ITEM}}:/etc/systemd/system/isupipe-dns.service etc/systemd/system/isupipe-dns.service

  config-check-dns:
    desc: Go DNSの正当性・永続化・初期ゾーンをローカルrace testで検証する
    dir: '{{.APP_DIR}}'
    cmds:
      - go test -race -run '^TestDNS' -count=1 ./...

  check-dns-linux:
    desc: 実ホストのLinuxで同期・復元・強制終了を検証する（競技DBとDNSには接続しない）
    cmds:
      - mkdir -p .task/go-dns
      - cd '{{.APP_DIR}}' && {{.GO_BUILD_ENV}} go test -c -o '{{.ROOT_DIR}}/.task/go-dns/dns.test' .
      - for: { var: DNS_HOSTS }
        cmd: |
          {{.SSH}} {{.SSH_USER}}@{{.ITEM}} 'mkdir -p /tmp/isucon-go-dns/go /tmp/isucon-go-dns/pdns'
          {{.RSYNC}} .task/go-dns/dns.test {{.SSH_USER}}@{{.ITEM}}:/tmp/isucon-go-dns/go/dns.test
          {{.RSYNC}} webapp/pdns/u.isucon.dev.zone {{.SSH_USER}}@{{.ITEM}}:/tmp/isucon-go-dns/pdns/u.isucon.dev.zone
          {{.SSH}} {{.SSH_USER}}@{{.ITEM}} 'cd /tmp/isucon-go-dns/go && ./dns.test -test.v -test.run "^TestDNS"'

  deploy-dns-dry:
    desc: Go DNSの転送先とrestartを実行せず表示
    deps: [build, build-deployctl]
    cmds:
      - task: gen
      - '{{.DEPLOYCTL_DIR}}/deployctl apply dns -dry-run -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'

  deploy-dns:
    desc: Go DNS設定を配布し、登録ログを保持してDNS役割のホストでrestart
    preconditions:
      - sh: test ! -f '{{.RUN_STATE_FILE}}'
        msg: active benchmark exists
    deps: [build, build-deployctl]
    cmds:
      - task: gen
      - '{{.DEPLOYCTL_DIR}}/deployctl apply dns -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'

  check-dns:
    desc: Go DNSの役割・実行バイナリ・A/NXDOMAIN/NODATAと廃止SQL backendを確認
    vars:
      BINARY_SHA256:
        sh: shasum -a 256 '{{.APP_DIR}}/{{.APP_NAME}}' | cut -d ' ' -f 1
    cmds:
      - for: { var: ALL_HOSTS }
        cmd: |
          {{.SSH}} {{.SSH_USER}}@{{.ITEM}} '
            set -eu
            if sudo systemctl is-enabled --quiet pdns || sudo systemctl is-active --quiet pdns; then
              echo "{{.ITEM}}: PowerDNS must be disabled and inactive" >&2
              exit 1
            fi
            case " {{.DNS_HOSTS}} " in
              *" {{.ITEM}} "*)
                sudo systemctl is-enabled --quiet isupipe-dns
                sudo systemctl is-active --quiet isupipe-dns
                pid=$(sudo systemctl show isupipe-dns -p MainPID --value)
                actual=$(sudo sha256sum "/proc/$pid/exe" | cut -d " " -f 1)
                test "$actual" = "{{.BINARY_SHA256}}"
                curl --fail --silent http://{{.DNS_IP}}:{{.DNS_CONTROL_PORT}}/status | python3 -c "import json,sys; s=json.load(sys.stdin); assert s[\"ready\"] and not s[\"failed\"]; print(s)"
                answer=$(dig +time=2 +tries=1 +short pipe.u.isucon.dev @127.0.0.1)
                test "$answer" = "{{.DNS_COMMON_ADDRESS}}"
                test "$(dig +time=2 +tries=1 +short ns1.u.isucon.dev @127.0.0.1)" = "{{index .PUBLIC_IP (splitList " " .DNS_HOSTS | first)}}"
                dig +time=2 +tries=1 +noall +answer pipe.u.isucon.dev @127.0.0.1 | awk "\$2 == 300 && \$4 == \"A\" {found=1} END {exit !found}"
                dig +time=2 +tries=1 unknown-go-dns-check.u.isucon.dev @127.0.0.1 | grep -q "status: NXDOMAIN"
                dig +time=2 +tries=1 pipe.u.isucon.dev AAAA @127.0.0.1 | grep -q "ANSWER: 0, AUTHORITY: 1"
                printf "{{.ITEM}}: Go DNS binary and answers match\n"
                ;;
              *)
                if sudo systemctl cat isupipe-dns >/dev/null 2>&1; then
                  if sudo systemctl is-enabled --quiet isupipe-dns || sudo systemctl is-active --quiet isupipe-dns; then
                    echo "{{.ITEM}}: DNS is running outside its role" >&2
                    exit 1
                  fi
                fi
                echo "{{.ITEM}}: DNS disabled"
                ;;
            esac
          '
      - |
        {{.SSH}} {{.SSH_USER}}@{{.MYSQL_HOST}} '
          test "$(sudo mysql -N -e "SELECT COUNT(*) FROM information_schema.SCHEMATA WHERE SCHEMA_NAME=\"isudns\"")" = 0
        '

  setup-smoke-probes:
    desc: 閾値を超える短い読み取りSQLでslow logの生成を確認
    preconditions:
      - sh: test ! -f '{{.RUN_STATE_FILE}}'
        msg: active benchmark exists
    cmds:
      - for: { var: MYSQL_HOSTS }
        cmd: '{{.SSH}} {{.SSH_USER}}@{{.ITEM}} "sudo mysql -N -e ''SELECT SLEEP(0.02)''"'
      # Let the one-second samplers emit points inside the smoke window.
      - sleep 2

  setup-readers-check:
    desc: RUNを作らずsetup成果物のDuckDB取り込みとdashboard parserを確認
    requires: { vars: [SMOKE_DIR] }
    env:
      ISUCON_SETUP_SMOKE: '{{.SMOKE_DIR}}'
    cmds:
      - cd tools/analysisctl && go test -run 'TestISUCON13' -v .
      - cd tools/dashboard/server && go test -run 'TestISUCON13' -v .

  setup-mysql-error-check:
    desc: setup成果物と同じ時間窓のMySQL障害ログを回収
    requires: { vars: [SMOKE_DIR] }
    deps: [build-measurectl]
    cmds:
      - '{{.MEASURECTL_DIR}}/measurectl digest -only mysql-error -run-dir {{.SMOKE_DIR}} -raw-dir {{.SMOKE_DIR}}/raw {{.MEASURECTL_REMOTE}}'
