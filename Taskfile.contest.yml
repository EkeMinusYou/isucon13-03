# Contest-specific tasks for this competition's solution.
#
# Taskfile.yml includes this file with flatten:true, so these tasks are called
# without a namespace and read the generic file's vars. Task names must not
# collide with the generic file: Go Task rejects duplicates instead of
# overriding them. The generic side reaches this file only through hook tasks
# it declares (currently prepare-db-assets and gen-contest-routing); a contest
# that has nothing to do defines the hook here with no commands.
version: '3'

tasks:
  check-reference-model-prereqs:
    desc: 参照モデルの変更前に計測停止と対象OS/Archを確認する
    preconditions:
      - sh: test ! -f '{{.RUN_STATE_FILE}}'
        msg: active benchmark exists
    deps: [build-measurectl, build-smoke]
    cmds:
      - '{{.MEASURECTL_DIR}}/measurectl collect check-clean {{.MEASURECTL_REMOTE}}'
      - for: { var: APP_HOSTS }
        cmd: |
          {{.SSH}} {{.SSH_USER}}@{{.ITEM}} '
            set -eu
            test "$(uname -s)" = Linux
            test "$(uname -m)" = x86_64
            test "$(curl --fail --silent http://127.0.0.1:6060/debug/profiles/status)" = "{\"cpu\":\"\",\"fgprof\":\"\"}"
            echo "{{.ITEM}}: Linux/amd64, no active profiles"
          '

  deploy-reference-model:
    desc: 参照モデルを配布し、公式初期化・更新反映・アプリ再起動後の復元を確認する
    preconditions:
      - sh: test ! -f '{{.RUN_STATE_FILE}}'
        msg: active benchmark exists
    cmds:
      - task: check-reference-model-prereqs
      - task: gen
      - task: build
      - task: db-recreate
      - task: check-app-deployment
        vars: { ICON_SMOKE_PHASE: write, REGISTRATION_SMOKE_PHASE: write, REFERENCES_SMOKE_PHASE: write }
      - task: deploy-app
      - task: check-app-deployment
        vars: { ICON_SMOKE_PHASE: read, REGISTRATION_SMOKE_PHASE: read, REFERENCES_SMOKE_PHASE: read }
      - task: check-role-split

  inspect-role-split-prereqs:
    desc: 全ホストのOS/Arch・firewallと移行先DBの接続ユーザーを読み取り確認する
    cmds:
      - for: { var: ALL_HOSTS }
        cmd: |
          {{.SSH}} {{.SSH_USER}}@{{.ITEM}} '
            set -eu
            uname -sm
            sudo ufw status
            if [ "{{.ITEM}}" = "{{.MYSQL_HOST}}" ]; then
              sudo mysql -N -e "SELECT User,Host FROM mysql.user WHERE User IN (\"isucon\",\"isudns\")"
            fi
          '

  deploy-role-split:
    desc: DNS・共有DB・Go/nginxを役割分離し、競技DB再作成・初期化・永続性確認まで行う
    preconditions:
      - sh: test ! -f '{{.RUN_STATE_FILE}}'
        msg: active benchmark exists
    deps: [build-measurectl]
    cmds:
      - '{{.MEASURECTL_DIR}}/measurectl collect check-clean {{.MEASURECTL_REMOTE}}'
      - for: { var: ALL_HOSTS }
        cmd: |
          {{.SSH}} {{.SSH_USER}}@{{.ITEM}} '
            set -eu
            test "$(uname -s)" = Linux
            test "$(uname -m)" = x86_64
            if sudo systemctl is-active --quiet {{.SERVICE}}; then
              test "$(curl --fail --silent http://127.0.0.1:6060/debug/profiles/status)" = "{\"cpu\":\"\",\"fgprof\":\"\"}"
            fi
          '
      - task: gen
      - task: build
      - task: db-recreate
      - task: deploy-nginx
      - task: apply-roles
      - task: check-role-split
      - task: check-app-deployment
        vars: { ICON_SMOKE_PHASE: write, REGISTRATION_SMOKE_PHASE: write }
      - task: deploy-all
      - task: check-app-deployment
        vars: { ICON_SMOKE_PHASE: read, REGISTRATION_SMOKE_PHASE: read }
      - task: check-role-split

  deploy-role-split-dry:
    desc: 役割分離のDB再作成・配布・起動順を実行せず表示する
    cmds:
      - task: gen
      - task: build
      - task: db-recreate-dry
      - task: deploy-all-dry

  check-role-split:
    desc: 役割分離後のサービス・DB接続・DNS応答を確認する
    cmds:
      - task: check-roles
      - task: check-network
      - task: check-pdns

  check-icon-unit:
    desc: 永続アイコン・条件付きGETのローカルrace testを実行する
    dir: '{{.APP_DIR}}'
    cmds: [go test -race ./...]

  deploy-icons:
    desc: 永続アイコン構成を配布し、DB再作成・初期化・nginx reload・再起動後の画像確認を行う
    preconditions:
      - sh: test ! -f '{{.RUN_STATE_FILE}}'
        msg: active benchmark exists
    deps: [build-measurectl]
    cmds:
      - '{{.MEASURECTL_DIR}}/measurectl collect check-clean {{.MEASURECTL_REMOTE}}'
      - task: gen
      - task: build
      - task: db-recreate
      - task: deploy-nginx
      - task: check-icons-deployment

  check-icons-deployment:
    desc: nginx経由の画像・条件付きGET・アプリ再起動後の永続性を確認する
    preconditions:
      - sh: test ! -f '{{.RUN_STATE_FILE}}'
        msg: active benchmark exists
    cmds:
      - task: check-app-deployment
        vars: { ICON_SMOKE_PHASE: write }
      - task: deploy-app
      - '{{.SSH}} {{.SSH_USER}}@{{.ENTRY_HOST}} ''{{.SMOKE_REMOTE_DIR}}/smoke {{.SMOKE_ARGS}} -icons-phase read'''

  check-app-improvements:
    desc: アイコン・応答・同時予約・統計・モデレーションを実MySQLの一時検証DBで確認する（競技DBは変更しない）
    preconditions:
      - sh: test ! -f '{{.RUN_STATE_FILE}}'
        msg: active benchmark exists
    deps: [build-measurectl]
    cmds:
      - '{{.MEASURECTL_DIR}}/measurectl collect check-clean {{.MEASURECTL_REMOTE}}'
      - for: { var: APP_HOSTS }
        cmd: '{{.SSH}} {{.SSH_USER}}@{{.ITEM}} ''test "$(curl --fail --silent http://127.0.0.1:6060/debug/profiles/status)" = "{\"cpu\":\"\",\"fgprof\":\"\"}"'''
      - mkdir -p .task/app-improvements
      - cd '{{.APP_DIR}}' && {{.GO_BUILD_ENV}} go test -c -o '{{.ROOT_DIR}}/.task/app-improvements/app.test' .
      - for: { var: MYSQL_HOSTS }
        cmd: |
          {{.SSH}} {{.SSH_USER}}@{{.ITEM}} 'mkdir -p /tmp/isucon-app-improvements'
          {{.RSYNC}} .task/app-improvements/app.test {{.SSH_USER}}@{{.ITEM}}:/tmp/isucon-app-improvements/app.test
          {{.RSYNC}} '{{.SQL_DIR}}/{{.SQL_SCHEMA_FILE}}' {{.SSH_USER}}@{{.ITEM}}:/tmp/isucon-app-improvements/schema.sql
          {{.SSH}} {{.SSH_USER}}@{{.ITEM}} '
            set -eu
            test "$(uname -s)" = Linux
            test "$(uname -m)" = x86_64
            cd {{.REMOTE_HOME}}/{{.APP_DIR}}
            sudo env ISUCON_TEST_MYSQL_DSN="root@unix(/var/run/mysqld/mysqld.sock)/" \
              ISUCON_TEST_SCHEMA=/tmp/isucon-app-improvements/schema.sql \
              /tmp/isucon-app-improvements/app.test -test.v -test.run "^TestImprovementsMySQL$"
          '

  check-app-deployment:
    desc: 実行バイナリ・索引・各nginxの認証APIを確認する（ベンチ・計測なし）
    preconditions:
      - sh: test ! -f '{{.RUN_STATE_FILE}}'
        msg: active benchmark exists
    deps: [build-smoke]
    vars:
      BINARY_SHA256:
        sh: shasum -a 256 '{{.APP_DIR}}/{{.APP_NAME}}' | cut -d ' ' -f 1
    cmds:
      - for: { var: APP_HOSTS }
        cmd: |
          {{.SSH}} {{.SSH_USER}}@{{.ITEM}} '
            set -eu
            pid=$(sudo systemctl show {{.SERVICE}} -p MainPID --value)
            test "$pid" -gt 0
            actual=$(sudo sha256sum "/proc/$pid/exe" | cut -d " " -f 1)
            test "$actual" = "{{.BINARY_SHA256}}"
            echo "{{.ITEM}}: running binary matches"
          '
      - for: { var: MYSQL_HOSTS }
        cmd: |
          {{.SSH}} {{.SSH_USER}}@{{.ITEM}} '
            set -eu
            indexes=$(sudo mysql -N -e "SELECT COUNT(DISTINCT TABLE_NAME, INDEX_NAME) FROM information_schema.STATISTICS WHERE TABLE_SCHEMA=\"{{.DB_NAME}}\" AND INDEX_NAME LIKE \"idx_%\"")
            test "$indexes" -eq 10
            columns=$(sudo mysql -N -e "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=\"{{.DB_NAME}}\" AND ((TABLE_NAME=\"users\" AND COLUMN_NAME=\"icon_hash\") OR (TABLE_NAME=\"icons\" AND COLUMN_NAME=\"hash\"))")
            test "$columns" -eq 2
            blobs=$(sudo mysql -N -e "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=\"{{.DB_NAME}}\" AND TABLE_NAME=\"icons\" AND DATA_TYPE LIKE \"%blob\"")
            test "$blobs" -eq 0
            echo "{{.ITEM}}: all 10 indexes and icon metadata columns exist; no icon BLOB"
            sudo mysql -t {{.DB_NAME}} -e "EXPLAIN SELECT * FROM livestream_tags WHERE livestream_id = 1"
            sudo mysql -t {{.DB_NAME}} -e "EXPLAIN SELECT * FROM reservation_slots WHERE start_at >= 1700874000 AND start_at < 1700877600 AND end_at <= 1700877600 FOR UPDATE"
          '
      - '{{.SSH}} {{.SSH_USER}}@{{.ENTRY_HOST}} ''mkdir -p {{.SMOKE_REMOTE_DIR}}'''
      - '{{.RSYNC}} {{.SMOKE_TOOL_DIR}}/smoke {{.SSH_USER}}@{{.ENTRY_HOST}}:{{.SMOKE_REMOTE_DIR}}/smoke'
      - '{{.SSH}} {{.SSH_USER}}@{{.ENTRY_HOST}} ''{{.SMOKE_REMOTE_DIR}}/smoke {{.SMOKE_ARGS}} -icons-phase "{{.ICON_SMOKE_PHASE | default ""}}" -registration-phase "{{.REGISTRATION_SMOKE_PHASE | default ""}}" -references-phase "{{.REFERENCES_SMOKE_PHASE | default ""}}" -dns-server {{.PDNS_IP}}:53 -dns-address {{.DNS_RECORD_ADDRESS}}'''

  setup-contest-assets:
    desc: 競技固有の依存サービス資材を取得
    cmds: [{task: setup-pdns}]

  prepare-db-assets:
    desc: deployへ載せる前にDB資材を生成・検証する（deploy系のhook、既定は何もしない）

  gen-contest-routing:
    desc: Taskfileの役割値からDB・DNS接続設定を生成する
    cmds:
      - mkdir -p tools/contest/generated
      - |
        cat > tools/contest/generated/topology.env <<'ENV'
        # GENERATED by task gen; host credentials remain in /home/isucon/env.sh.
        ISUCON13_MYSQL_DIALCONFIG_ADDRESS={{.MYSQL_IP}}
        ISUCON13_MYSQL_DIALCONFIG_PORT=3306
        ISUCON13_POWERDNS_SUBDOMAIN_ADDRESS={{.DNS_RECORD_ADDRESS}}
        ENV
      - |
        cat > mysql/mysql.conf.d/zz-topology.cnf <<'CNF'
        # GENERATED by task gen; listen on the database host's private address.
        [mysqld]
        bind-address={{.MYSQL_IP}}
        CNF
      - for: { var: ALL_HOSTS }
        cmd: |
          printf 'gmysql-host=%s\n' '{{.MYSQL_IP}}' > etc/hosts/{{.ITEM}}/powerdns/pdns.d/gmysql-host.conf
      - |
        cat > tools/contest/generated/remote-users.sql <<'SQL'
        -- GENERATED by task gen. Reuse local authentication without exporting credentials.
        SELECT CONCAT('CREATE USER IF NOT EXISTS ', QUOTE(User), '@', QUOTE('{{index .IP (splitList " " .APP_HOSTS | first)}}'),
                      ' IDENTIFIED WITH ', plugin, ' AS ', QUOTE(authentication_string)) INTO @app_user_sql
        FROM mysql.user WHERE User = 'isucon' AND Host = 'localhost';
        PREPARE app_user FROM @app_user_sql;
        EXECUTE app_user;
        DEALLOCATE PREPARE app_user;
        GRANT ALL PRIVILEGES ON isupipe.* TO 'isucon'@'{{index .IP (splitList " " .APP_HOSTS | first)}}';

        SELECT CONCAT('CREATE USER IF NOT EXISTS ', QUOTE(User), '@', QUOTE('{{.PDNS_IP}}'),
                      ' IDENTIFIED WITH ', plugin, ' AS ', QUOTE(authentication_string)) INTO @dns_user_sql
        FROM mysql.user WHERE User = 'isudns' AND Host = 'localhost';
        PREPARE dns_user FROM @dns_user_sql;
        EXECUTE dns_user;
        DEALLOCATE PREPARE dns_user;
        GRANT ALL PRIVILEGES ON isudns.* TO 'isudns'@'{{.PDNS_IP}}';

        SELECT CONCAT('CREATE USER IF NOT EXISTS ', QUOTE(User), '@', QUOTE('{{index .IP (splitList " " .APP_HOSTS | first)}}'),
                      ' IDENTIFIED WITH ', plugin, ' AS ', QUOTE(authentication_string)) INTO @dns_client_sql
        FROM mysql.user WHERE User = 'isudns' AND Host = 'localhost';
        PREPARE dns_client FROM @dns_client_sql;
        EXECUTE dns_client;
        DEALLOCATE PREPARE dns_client;
        GRANT ALL PRIVILEGES ON isudns.* TO 'isudns'@'{{index .IP (splitList " " .APP_HOSTS | first)}}';
        SQL

  setup-pdns:
    desc: PowerDNSのホスト別設定・unit・公式schemaと環境を取得
    cmds:
      - for: { var: ALL_HOSTS }
        cmd: |
          mkdir -p etc/hosts/{{.ITEM}}/powerdns
          {{.RSYNC}} {{.SSH_USER}}@{{.ITEM}}:/etc/powerdns/ etc/hosts/{{.ITEM}}/powerdns/
          {{.RSYNC}} {{.SSH_USER}}@{{.ITEM}}:{{.REMOTE_HOME}}/env.sh etc/hosts/{{.ITEM}}/env.sh
      - mkdir -p etc/systemd/system/pdns.service.d webapp/sql/schema etc/vendor-scripts
      - '{{.RSYNC}} {{.SSH_USER}}@{{.CONF_SRC}}:/lib/systemd/system/pdns.service etc/vendor-units/'
      - '{{.RSYNC}} {{.SSH_USER}}@{{.CONF_SRC}}:/etc/systemd/system/pdns.service.d/ etc/systemd/system/pdns.service.d/'
      - '{{.RSYNC}} --copy-links {{.SSH_USER}}@{{.MYSQL_HOST}}:/usr/share/doc/pdns-backend-mysql/schema.mysql.sql webapp/sql/schema/pdns.sql'
      - '{{.RSYNC}} {{.SSH_USER}}@{{.CONF_SRC}}:/usr/local/bin/isupipe-init-zone-once.sh etc/vendor-scripts/init_zone_once.sh'

  config-check-pdns:
    desc: PowerDNSを正規配布先へ転送して構文検査（restartなし）
    preconditions:
      - sh: test ! -f '{{.RUN_STATE_FILE}}'
        msg: active benchmark exists
    deps: [build-deployctl]
    cmds:
      - task: gen
      - '{{.DEPLOYCTL_DIR}}/deployctl apply pdns-config -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'

  deploy-pdns-dry:
    desc: PowerDNSの転送先とrestartを実行せず表示
    deps: [build-deployctl]
    cmds:
      - task: gen
      - '{{.DEPLOYCTL_DIR}}/deployctl apply pdns -dry-run -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'

  deploy-pdns:
    desc: PowerDNS設定を配布し、DNS役割のホストでrestart
    preconditions:
      - sh: test ! -f '{{.RUN_STATE_FILE}}'
        msg: active benchmark exists
    deps: [build-deployctl]
    cmds:
      - task: gen
      - '{{.DEPLOYCTL_DIR}}/deployctl apply pdns -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'

  check-pdns:
    desc: PowerDNSの役割とDNSが返すHTTP入口を確認
    cmds:
      - for: { var: ALL_HOSTS }
        cmd: |
          {{.SSH}} {{.SSH_USER}}@{{.ITEM}} '
            set -eu
            case " {{.PDNS_HOSTS}} " in
              *" {{.ITEM}} "*)
                sudo systemctl is-enabled --quiet pdns
                sudo systemctl is-active --quiet pdns
                sudo pdns_control list >/dev/null
                answer=$(dig +time=2 +tries=1 +short pipe.u.isucon.dev @127.0.0.1)
                test "$answer" = "{{.DNS_RECORD_ADDRESS}}"
                printf "DNS A record: %s\n" "$answer"
                ;;
              *)
                ! sudo systemctl is-enabled --quiet pdns
                ! sudo systemctl is-active --quiet pdns
                echo "{{.ITEM}}: DNS disabled"
                ;;
            esac
          '

  setup-smoke-probes:
    desc: 閾値を超える短い読み取りSQLでslow logの生成を確認
    preconditions:
      - sh: test ! -f '{{.RUN_STATE_FILE}}'
        msg: active benchmark exists
    cmds:
      - for: { var: MYSQL_HOSTS }
        cmd: '{{.SSH}} {{.SSH_USER}}@{{.ITEM}} "sudo mysql -N -e ''SELECT SLEEP(0.02)''"'
      # Let the one-second samplers emit points inside the smoke window.
      - sleep 2

  setup-readers-check:
    desc: RUNを作らずsetup成果物のDuckDB取り込みとdashboard parserを確認
    requires: { vars: [SMOKE_DIR] }
    env:
      ISUCON_SETUP_SMOKE: '{{.SMOKE_DIR}}'
    cmds:
      - cd tools/analysisctl && go test -run 'TestISUCON13' -v .
      - cd tools/dashboard/server && go test -run 'TestISUCON13' -v .

  setup-mysql-error-check:
    desc: setup成果物と同じ時間窓のMySQL障害ログを回収
    requires: { vars: [SMOKE_DIR] }
    deps: [build-measurectl]
    cmds:
      - '{{.MEASURECTL_DIR}}/measurectl digest -only mysql-error -run-dir {{.SMOKE_DIR}} -raw-dir {{.SMOKE_DIR}}/raw {{.MEASURECTL_REMOTE}}'
