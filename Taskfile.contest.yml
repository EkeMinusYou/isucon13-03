# Contest-specific tasks for this competition's solution.
#
# Taskfile.yml includes this file with flatten:true, so these tasks are called
# without a namespace and read the generic file's vars. Task names must not
# collide with the generic file: Go Task rejects duplicates instead of
# overriding them. The generic side reaches this file only through hook tasks
# it declares (currently prepare-db-assets and gen-contest-routing); a contest
# that has nothing to do defines the hook here with no commands.
version: '3'

tasks:
  check-app-improvements:
    desc: 統計・モデレーションを実MySQLの一時検証DBで確認する（競技DBは変更しない）
    preconditions:
      - sh: test ! -f '{{.RUN_STATE_FILE}}'
        msg: active benchmark exists
    deps: [build-measurectl]
    cmds:
      - '{{.MEASURECTL_DIR}}/measurectl collect check-clean {{.MEASURECTL_REMOTE}}'
      - mkdir -p .task/app-improvements
      - cd '{{.APP_DIR}}' && {{.GO_BUILD_ENV}} go test -c -o '{{.ROOT_DIR}}/.task/app-improvements/app.test' .
      - for: { var: MYSQL_HOSTS }
        cmd: |
          {{.SSH}} {{.SSH_USER}}@{{.ITEM}} 'mkdir -p /tmp/isucon-app-improvements'
          {{.RSYNC}} .task/app-improvements/app.test {{.SSH_USER}}@{{.ITEM}}:/tmp/isucon-app-improvements/app.test
          {{.RSYNC}} '{{.SQL_DIR}}/{{.SQL_SCHEMA_FILE}}' {{.SSH_USER}}@{{.ITEM}}:/tmp/isucon-app-improvements/schema.sql
          {{.SSH}} {{.SSH_USER}}@{{.ITEM}} '
            set -eu
            test "$(uname -s)" = Linux
            test "$(uname -m)" = x86_64
            test "$(curl --fail --silent http://127.0.0.1:6060/debug/profiles/status)" = "{\"cpu\":\"\",\"fgprof\":\"\"}"
            sudo env ISUCON_TEST_MYSQL_DSN="root@unix(/var/run/mysqld/mysqld.sock)/" \
              ISUCON_TEST_SCHEMA=/tmp/isucon-app-improvements/schema.sql \
              /tmp/isucon-app-improvements/app.test -test.v -test.run "^TestImprovementsMySQL$"
          '

  check-app-deployment:
    desc: 実行バイナリ・索引・各nginxの認証APIを確認する（ベンチ・計測なし）
    preconditions:
      - sh: test ! -f '{{.RUN_STATE_FILE}}'
        msg: active benchmark exists
    deps: [build-smoke]
    vars:
      BINARY_SHA256:
        sh: shasum -a 256 '{{.APP_DIR}}/{{.APP_NAME}}' | cut -d ' ' -f 1
    cmds:
      - for: { var: MYSQL_HOSTS }
        cmd: |
          {{.SSH}} {{.SSH_USER}}@{{.ITEM}} '
            set -eu
            pid=$(sudo systemctl show {{.SERVICE}} -p MainPID --value)
            test "$pid" -gt 0
            actual=$(sudo sha256sum "/proc/$pid/exe" | cut -d " " -f 1)
            test "$actual" = "{{.BINARY_SHA256}}"
            indexes=$(sudo mysql -N -e "SELECT COUNT(DISTINCT TABLE_NAME, INDEX_NAME) FROM information_schema.STATISTICS WHERE TABLE_SCHEMA=\"{{.DB_NAME}}\" AND INDEX_NAME LIKE \"idx_%\"")
            test "$indexes" -eq 11
            echo "{{.ITEM}}: running binary matches; all 11 indexes exist"
            sudo mysql -t {{.DB_NAME}} -e "EXPLAIN SELECT * FROM livestream_tags WHERE livestream_id = 1"
          '
      - '{{.SSH}} {{.SSH_USER}}@{{.ENTRY_HOST}} ''mkdir -p {{.SMOKE_REMOTE_DIR}}'''
      - '{{.RSYNC}} {{.SMOKE_TOOL_DIR}}/smoke {{.SSH_USER}}@{{.ENTRY_HOST}}:{{.SMOKE_REMOTE_DIR}}/smoke'
      - '{{.SSH}} {{.SSH_USER}}@{{.ENTRY_HOST}} ''{{.SMOKE_REMOTE_DIR}}/smoke {{.SMOKE_ARGS}}'''

  setup-contest-assets:
    desc: 競技固有の依存サービス資材を取得
    cmds: [{task: setup-pdns}]

  prepare-db-assets:
    desc: deployへ載せる前にDB資材を生成・検証する（deploy系のhook、既定は何もしない）

  gen-contest-routing:
    desc: 解法固有のupstreamとホスト別生成物を追加する（genのhook、既定は何もしない）

  setup-pdns:
    desc: PowerDNSのホスト別設定・unit・公式schemaと環境を取得
    cmds:
      - for: { var: MYSQL_HOSTS }
        cmd: |
          mkdir -p etc/hosts/{{.ITEM}}/powerdns
          {{.RSYNC}} {{.SSH_USER}}@{{.ITEM}}:/etc/powerdns/ etc/hosts/{{.ITEM}}/powerdns/
          {{.RSYNC}} {{.SSH_USER}}@{{.ITEM}}:{{.REMOTE_HOME}}/env.sh etc/hosts/{{.ITEM}}/env.sh
      - mkdir -p etc/systemd/system/pdns.service.d webapp/sql/schema etc/vendor-scripts
      - '{{.RSYNC}} {{.SSH_USER}}@{{.CONF_SRC}}:/lib/systemd/system/pdns.service etc/vendor-units/'
      - '{{.RSYNC}} {{.SSH_USER}}@{{.CONF_SRC}}:/etc/systemd/system/pdns.service.d/ etc/systemd/system/pdns.service.d/'
      - '{{.RSYNC}} --copy-links {{.SSH_USER}}@{{.MYSQL_HOST}}:/usr/share/doc/pdns-backend-mysql/schema.mysql.sql webapp/sql/schema/pdns.sql'
      - '{{.RSYNC}} {{.SSH_USER}}@{{.CONF_SRC}}:/opt/init_zone_once.sh etc/vendor-scripts/'

  config-check-pdns:
    desc: PowerDNSを正規配布先へ転送して構文検査（restartなし）
    preconditions:
      - sh: test ! -f '{{.RUN_STATE_FILE}}'
        msg: active benchmark exists
    deps: [build-deployctl]
    cmds:
      - '{{.DEPLOYCTL_DIR}}/deployctl apply pdns-config -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'

  deploy-pdns-dry:
    desc: PowerDNSの転送先とrestartを実行せず表示
    deps: [build-deployctl]
    cmds:
      - '{{.DEPLOYCTL_DIR}}/deployctl apply pdns -dry-run -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'

  deploy-pdns:
    desc: 全MYSQL_HOSTSのPowerDNS設定を配布してrestart
    preconditions:
      - sh: test ! -f '{{.RUN_STATE_FILE}}'
        msg: active benchmark exists
    deps: [build-deployctl]
    cmds:
      - '{{.DEPLOYCTL_DIR}}/deployctl apply pdns -config {{.DEPLOYCTL_CONFIG}} {{.DEPLOYCTL_COMMON}}'

  check-pdns:
    desc: 全MYSQL_HOSTSのPowerDNS enable・active・DNS応答を確認
    cmds:
      - for: { var: MYSQL_HOSTS }
        cmd: |
          {{.SSH}} {{.SSH_USER}}@{{.ITEM}} '
            set -eu
            sudo systemctl is-enabled --quiet pdns
            sudo systemctl is-active --quiet pdns
            sudo pdns_control list >/dev/null
            . /home/isucon/env.sh
            answer=$(dig +time=2 +tries=1 +short pipe.u.isucon.dev @127.0.0.1)
            test "$answer" = "$ISUCON13_POWERDNS_SUBDOMAIN_ADDRESS"
            printf "DNS A record: %s\n" "$answer"
          '

  setup-smoke-probes:
    desc: 閾値を超える短い読み取りSQLでslow logの生成を確認
    preconditions:
      - sh: test ! -f '{{.RUN_STATE_FILE}}'
        msg: active benchmark exists
    cmds:
      - for: { var: MYSQL_HOSTS }
        cmd: '{{.SSH}} {{.SSH_USER}}@{{.ITEM}} "sudo mysql -N -e ''SELECT SLEEP(0.02)''"'
      # Let the one-second samplers emit points inside the smoke window.
      - sleep 2

  setup-readers-check:
    desc: RUNを作らずsetup成果物のDuckDB取り込みとdashboard parserを確認
    requires: { vars: [SMOKE_DIR] }
    env:
      ISUCON_SETUP_SMOKE: '{{.SMOKE_DIR}}'
    cmds:
      - cd tools/analysisctl && go test -run 'TestISUCON13' -v .
      - cd tools/dashboard/server && go test -run 'TestISUCON13' -v .

  setup-mysql-error-check:
    desc: setup成果物と同じ時間窓のMySQL障害ログを回収
    requires: { vars: [SMOKE_DIR] }
    deps: [build-measurectl]
    cmds:
      - '{{.MEASURECTL_DIR}}/measurectl digest -only mysql-error -run-dir {{.SMOKE_DIR}} -raw-dir {{.SMOKE_DIR}}/raw {{.MEASURECTL_REMOTE}}'
